name: Instructree code scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructree:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate Instructree SARIF
        id: scan
        continue-on-error: true
        run: node bin/instructree.js scan . --sarif > instructree.sarif
      - name: Upload Instructree SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: instructree.sarif
          category: instructree
      - name: Enforce Instructree policy
        if: ${{ steps.scan.outcome == 'failure' }}
        run: exit 1
