<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Instructree — see the instructions before your coding agent does</title>
  <desc id="desc">A dark terminal-style social card showing Instructree mapping repository instruction files.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-opacity="0.23"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1110" cy="60" r="260" fill="#58a6ff" opacity="0.05"/>
  <circle cx="1180" cy="600" r="300" fill="#7ee787" opacity="0.04"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="56" y="92" fill="url(#accent)" font-size="64" font-weight="800" letter-spacing="-3">Instructree</text>
    <text x="58" y="137" fill="#c9d1d9" font-size="24">See the instructions before your coding agent does.</text>

    <g font-size="13" font-weight="600">
      <rect x="680" y="52" width="110" height="34" rx="17" fill="#21262d" stroke="#3d444d"/>
      <text x="735" y="74" fill="#f0f6fc" text-anchor="middle">AGENTS.md</text>
      <rect x="800" y="52" width="150" height="34" rx="17" fill="#21262d" stroke="#3d444d"/>
      <text x="875" y="74" fill="#f0f6fc" text-anchor="middle">AGENTS.override</text>
      <rect x="960" y="52" width="112" height="34" rx="17" fill="#21262d" stroke="#3d444d"/>
      <text x="1016" y="74" fill="#f0f6fc" text-anchor="middle">CLAUDE.md</text>
      <rect x="1082" y="52" width="92" height="34" rx="17" fill="#21262d" stroke="#3d444d"/>
      <text x="1128" y="74" fill="#f0f6fc" text-anchor="middle">Copilot</text>
      <rect x="1184" y="52" width="70" height="34" rx="17" fill="#21262d" stroke="#3d444d"/>
      <text x="1219" y="74" fill="#f0f6fc" text-anchor="middle">Skills</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="178" width="1168" height="382" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <path d="M56 198Q56 178 76 178H1204Q1224 178 1224 198V232H56Z" fill="#161b22"/>
    <circle cx="88" cy="205" r="7" fill="#ff5f56"/>
    <circle cx="112" cy="205" r="7" fill="#ffbd2e"/>
    <circle cx="136" cy="205" r="7" fill="#27c93f"/>
    <text x="640" y="211" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">~/acme-app</text>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">
      <text x="88" y="276" fill="#7ee787">$</text>
      <text x="114" y="276" fill="#f0f6fc">instructree explain src/api/client.ts --client codex</text>

      <text x="88" y="326" fill="#f0f6fc" font-weight="700">Codex project chain</text>
      <text x="88" y="368" fill="#58a6ff">1. AGENTS.override.md</text>
      <text x="390" y="368" fill="#8b949e">repository-wide</text>
      <text x="88" y="404" fill="#58a6ff">2. src/AGENTS.md</text>
      <text x="390" y="404" fill="#8b949e">directory scope: src/</text>
      <text x="88" y="440" fill="#58a6ff">3. src/api/AGENTS.override.md</text>
      <text x="510" y="440" fill="#8b949e">directory scope: src/api/</text>

      <text x="88" y="500" fill="#7ee787" font-weight="700">broad → specific</text>
      <text x="294" y="500" fill="#8b949e">· repository-only · no uploads</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">
    <text x="56" y="608" fill="#8b949e">zero dependencies</text>
    <circle cx="220" cy="603" r="3" fill="#3d444d"/>
    <text x="238" y="608" fill="#8b949e">GitHub Action</text>
    <circle cx="378" cy="603" r="3" fill="#3d444d"/>
    <text x="396" y="608" fill="#8b949e">Codex skill</text>
    <circle cx="522" cy="603" r="3" fill="#3d444d"/>
    <text x="540" y="608" fill="#8b949e">recursive imports</text>
    <text x="1224" y="608" fill="#58a6ff" text-anchor="end">github.com/kotobuki09/instructree</text>
  </g>
</svg>
