<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Instructree import graph demo</title>
  <desc id="desc">A terminal audit showing the recursive instruction files imported by AGENTS.md.</desc>
  <rect width="1100" height="520" rx="18" fill="#0d1117"/>
  <rect width="1100" height="54" rx="18" fill="#161b22"/>
  <rect y="38" width="1100" height="16" fill="#161b22"/>
  <circle cx="28" cy="27" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="27" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="27" r="7" fill="#27c93f"/>
  <text x="550" y="33" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">~/acme-app</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="34" y="92" fill="#7ee787">$</text>
    <text x="56" y="92" fill="#f0f6fc">npx --yes github:kotobuki09/instructree imports</text>

    <text x="34" y="132" fill="#f0f6fc" font-weight="700">instructree imports</text>
    <text x="246" y="132" fill="#8b949e">· GitHub Copilot CLI · /home/me/acme-app</text>

    <text x="34" y="182" fill="#58a6ff">AGENTS.md</text>
    <text x="34" y="218" fill="#c9d1d9">├─ docs/base-rules.md</text>
    <text x="324" y="218" fill="#8b949e">:4</text>
    <text x="34" y="254" fill="#c9d1d9">│  ├─ docs/testing.md</text>
    <text x="324" y="254" fill="#8b949e">:8</text>
    <text x="34" y="290" fill="#c9d1d9">│  └─ docs/shared.md</text>
    <text x="324" y="290" fill="#8b949e">:9</text>
    <text x="34" y="326" fill="#c9d1d9">└─ docs/security.md</text>
    <text x="324" y="326" fill="#8b949e">:5</text>

    <text x="34" y="390" fill="#7ee787">clean</text>
    <text x="104" y="390" fill="#8b949e">· 1 root · 4 imported files · 0 errors</text>

    <text x="34" y="452" fill="#8b949e">recursive · repository-bounded · deterministic · zero dependencies</text>
  </g>
</svg>
