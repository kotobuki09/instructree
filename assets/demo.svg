<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Instructree terminal demo</title>
  <desc id="desc">A terminal scan showing always-on and path-scoped instructions and a possible conflicting rule.</desc>
  <rect width="1100" height="520" rx="18" fill="#0d1117"/>
  <rect width="1100" height="54" rx="18" fill="#161b22"/>
  <rect y="38" width="1100" height="16" fill="#161b22"/>
  <circle cx="28" cy="27" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="27" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="27" r="7" fill="#27c93f"/>
  <text x="550" y="33" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">~/acme-app</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="34" y="92" fill="#7ee787">$</text>
    <text x="56" y="92" fill="#f0f6fc">npx instructree</text>

    <text x="34" y="132" fill="#f0f6fc" font-weight="700">instructree</text>
    <text x="154" y="132" fill="#8b949e">· /home/me/acme-app</text>

    <text x="34" y="178" fill="#58a6ff">always-on instructions</text>
    <text x="34" y="210" fill="#c9d1d9">├─ AGENTS.md</text>
    <text x="34" y="242" fill="#c9d1d9">├─ .github/copilot-instructions.md</text>
    <text x="34" y="274" fill="#c9d1d9">└─ packages/api/AGENTS.md</text>

    <text x="34" y="320" fill="#58a6ff">path-scoped instructions</text>
    <text x="34" y="352" fill="#c9d1d9">└─ .github/instructions/typescript.instructions.md</text>
    <text x="692" y="352" fill="#8b949e">**/*.ts</text>

    <text x="34" y="404" fill="#d29922">warn</text>
    <text x="92" y="404" fill="#f0f6fc">W301 packages/api/AGENTS.md:6</text>
    <text x="92" y="436" fill="#c9d1d9">possible conflict with AGENTS.md:8 — review 'Never use tabs.'</text>

    <text x="34" y="486" fill="#d29922">review</text>
    <text x="104" y="486" fill="#8b949e">· 4 files · 0 errors · 1 warning · 0 notes</text>
  </g>
</svg>
